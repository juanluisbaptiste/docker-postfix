name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push (e.g. 1.11.0) - checks out tag v1.11.0'
        required: true

jobs:
  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Parse version
        if: github.event_name == 'workflow_dispatch'
        id: version
        run: |
          v="${{ github.event.inputs.version }}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a semantic version, e.g. 1.11.0"
            exit 1
          fi
          IFS='.' read -r major minor patch _ <<< "$v"
          # Only refresh the 'latest' tag when this is the newest stable release,
          # so re-pushing an older version never rolls 'latest' backwards.
          highest=$(git ls-remote --tags "https://github.com/${{ github.repository }}" 'refs/tags/v*' \
            | awk '{print $2}' \
            | sed 's|^refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          {
            echo "major=${major}"
            echo "minor=${major}.${minor}"
            echo "patch=${major}.${minor}.${patch}"
            echo "ref=v${v}"
            if [ "$v" = "$highest" ]; then echo "latest=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # On manual dispatch, check out the tag for the requested version.
          # On release events this is empty and the default (the release tag) is used.
          ref: ${{ steps.version.outputs.ref }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: juanluisbaptiste/postfix
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{version}}
            alpine
            type=raw,value=latest,enable=${{ github.event_name == 'release' || steps.version.outputs.latest == 'true' }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.patch }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
